name: Deploy RedVital QA

on:
  push:
    branches:
      - 'release/**' 
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Detener y limpiar la versión anterior
        # El '|| true' evita que el pipeline falle si es la primera vez que se ejecuta y no hay nada que detener
        run: |
          docker stop redvital-qa-container || true
          docker rm redvital-qa-container || true

      - name: Construir la nueva imagen de Docker
        # Utiliza el Dockerfile que está en la raíz de tu proyecto
        run: docker build -t redvital-campanas:qa -f Dockerfile .

      - name: Desplegar el nuevo contenedor
        # Configura la variable de entorno para que el API lea el appsettings.QA.json
        # Ajusta el puerto '5000' por el puerto en el que desees exponer la API en tu VM Ubuntu
        run: |
          docker run -d \
            --name redvital-qa-container \
            -p 5000:80 \
            -p 5001:443 \
            -e ASPNETCORE_ENVIRONMENT=QA \
            --restart unless-stopped \
            redvital-campanas:qa